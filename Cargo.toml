[workspace]
members = ["crates/*", "bins/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
spider-common = { path = "crates/spider-common", default-features = false }
spider-notify = { path = "crates/spider-notify" }
spider-uploader = { path = "crates/spider-uploader" }

aes = "0.9"
aes-gcm = "0.11"
anyhow = "1.0"
base64 = "0.23"
calamine = "0.38"
chrono = { version = "0.4", features = ["serde"] }
cipher = "0.5"
dirs = "7.0"
glob = "0.3"
hex = "0.4"
hmac = "0.13"
httpdate = "1"
image = "0.25"
indexmap = "2.14"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
md5 = "0.8"
ndarray = "0.17"
ort = "2.0.0-rc.15"
quick-xml = { version = "0.42", features = ["serialize"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "form", "cookies", "rustls"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
tar = "0.4"
thiserror = "2.0"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
zstd = { version = "0.14", features = ["zstdmt"] }
