[package]
name = "spider-notify"
version = "0.2.0"
edition = "2024"

[dependencies]
spider-common = { path = "../spider-common", default-features = false }
aes-gcm = "0.11"
anyhow = "1.0"
base64 = "0.23"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "form", "cookies", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[dev-dependencies]
toml = "1.1"
