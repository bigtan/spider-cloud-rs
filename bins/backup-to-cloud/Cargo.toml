[package]
name = "backup-to-cloud"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "backup-to-cloud"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
spider-common = { path = "../../crates/spider-common" }
spider-notify = { path = "../../crates/spider-notify" }
spider-uploader = { path = "../../crates/spider-uploader" }
toml = "1.1"
tracing = "0.1"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
