name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Set up Rust
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Rust Cache
        if: matrix.os == 'windows-latest'
        uses: Swatinem/rust-cache@v2
      - name: Build Linux binaries on Debian 13
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target/debian13 \
            rust:1-trixie \
            cargo build --release --bins --locked
      - name: Verify Linux binaries on Debian 13
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE/target/debian13/release:/app:ro" \
            debian:13-slim sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates libgcc-s1 libstdc++6
              cd /tmp
              for binary in backup-to-cloud cfmmc-crawler-rs cloud-uploader-rs; do
                ldd "/app/$binary" > /tmp/ldd.txt
                cat /tmp/ldd.txt
                if grep -q "not found" /tmp/ldd.txt; then
                  exit 1
                fi
                # Exercise startup without credentials or network operations.
                status=0
                "/app/$binary" unused.toml extra > /tmp/startup.txt 2>&1 || status=$?
                cat /tmp/startup.txt
                test "$status" -eq 1
                grep -q "Too many arguments" /tmp/startup.txt
              done
            '
      - name: Build Windows binaries
        if: matrix.os == 'windows-latest'
        run: cargo build --release --bins
      - name: Prepare release bundle
        shell: bash
        run: |
          set -e
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            APP_DIR="spider-cloud-rs-${{ github.ref_name }}-windows-latest"
          else
            APP_DIR="spider-cloud-rs-${{ github.ref_name }}-x86_64-unknown-linux-gnu"
          fi
          mkdir -p "$APP_DIR"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/release/backup-to-cloud.exe "$APP_DIR/"
            cp target/release/cfmmc-crawler-rs.exe "$APP_DIR/"
            cp target/release/cloud-uploader-rs.exe "$APP_DIR/"
            ARCHIVE_NAME="$APP_DIR.zip"
          else
            cp target/debian13/release/backup-to-cloud "$APP_DIR/"
            cp target/debian13/release/cfmmc-crawler-rs "$APP_DIR/"
            cp target/debian13/release/cloud-uploader-rs "$APP_DIR/"
            ARCHIVE_NAME="$APP_DIR.tar.gz"
          fi

          cp backup.toml.example "$APP_DIR/"
          cp cfmmc.toml.example "$APP_DIR/"
          cp cloud-uploader.toml.example "$APP_DIR/"
          mkdir -p "$APP_DIR/models"
          cp models/model.onnx "$APP_DIR/models/"
          cp models/vocab.txt "$APP_DIR/models/"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a "$ARCHIVE_NAME" "./$APP_DIR"
          else
            tar -czf "$ARCHIVE_NAME" "$APP_DIR"
          fi
      - name: Upload zipped binary
        uses: actions/upload-artifact@v7
        with:
          name: spider-cloud-rs-${{ matrix.os }}
          path: |
            *.zip
            *.tar.gz
          retention-days: 7
        

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --output RELEASE_NOTES.md
      - name: Download all zipped binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
